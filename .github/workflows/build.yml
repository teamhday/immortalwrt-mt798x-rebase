name: Build NR3053

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          build-essential clang flex bison g++ gawk gcc-multilib \
          g++-multilib gettext git libncurses5-dev libssl-dev \
          python3 python3-pip rsync unzip zlib1g-dev file wget

    - name: Update feeds
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Load config
      run: |
        cp config/mt7981-ax3000.config .config
        make defconfig

    - name: Build
      run: |
        make -j1 V=s

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: firmware
        path: bin/targets/**/*
